<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="35%" stop-color="#0B1728" />
      <stop offset="70%" stop-color="#0A223B" />
      <stop offset="100%" stop-color="#040911" />
    </linearGradient>

    <radialGradient id="civicGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#0369A1" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#082F49" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="clockLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="chartWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="chartFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B1728" stop-opacity="0.01" />
    </linearGradient>

    <!-- Column & Architecture Shading -->
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142A46" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0B1625" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3960" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2D5A8F" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10233B" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dataGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="60" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.15" />
    </pattern>

    <!-- Perspective Grid Pattern -->
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#0284C7" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Base Background Canvas -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  <rect width="1920" height="1080" fill="url(#civicGlow)" />

  <!-- Data Matrix / Financial Grid Layer -->
  <rect width="1920" height="750" fill="url(#dataGrid)" />

  <!-- Background Horizon Stars / Data Nodes -->
  <g opacity="0.6">
    <circle cx="150" cy="180" r="1.5" fill="#38BDF8" opacity="0.8" />
    <circle cx="280" cy="90" r="1.2" fill="#BAE6FD" opacity="0.5" />
    <circle cx="420" cy="220" r="1.5" fill="#38BDF8" opacity="0.7" />
    <circle cx="600" cy="120" r="1.8" fill="#38BDF8" opacity="0.6" />
    <circle cx="850" cy="70" r="1.2" fill="#BAE6FD" opacity="0.5" />
    <circle cx="1100" cy="140" r="2" fill="#38BDF8" opacity="0.7" />
    <circle cx="1320" cy="90" r="1.5" fill="#BAE6FD" opacity="0.8" />
    <circle cx="1550" cy="200" r="1.8" fill="#38BDF8" opacity="0.6" />
    <circle cx="1780" cy="110" r="1.5" fill="#38BDF8" opacity="0.7" />
    <circle cx="1860" cy="230" r="1.2" fill="#BAE6FD" opacity="0.5" />
  </g>

  <!-- Civic Architecture Silhouette (Grand Town Hall / Casa Consistorial elevation) -->
  <g opacity="0.38" transform="translate(160, 180)">
    
    <!-- Horizon Platform Base -->
    <rect x="200" y="580" width="1200" height="24" fill="#0E2238" rx="4" />
    <rect x="250" y="560" width="1100" height="20" fill="#132B48" rx="3" />
    <rect x="300" y="540" width="1000" height="20" fill="#163354" rx="2" />

    <!-- Main Building Wings -->
    <!-- Left Wing -->
    <rect x="340" y="320" width="260" height="220" fill="url(#buildingGrad)" rx="2" stroke="#254770" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Left Wing Roof Balustrade -->
    <rect x="330" y="305" width="280" height="15" fill="#1A3A5E" />
    <g fill="#2D5A8F" opacity="0.6">
      <rect x="350" y="290" width="12" height="15" rx="2" />
      <rect x="390" y="290" width="12" height="15" rx="2" />
      <rect x="430" y="290" width="12" height="15" rx="2" />
      <rect x="470" y="290" width="12" height="15" rx="2" />
      <rect x="510" y="290" width="12" height="15" rx="2" />
      <rect x="550" y="290" width="12" height="15" rx="2" />
      <rect x="590" y="290" width="12" height="15" rx="2" />
      <rect x="330" y="285" width="280" height="5" rx="1" />
    </g>

    <!-- Left Wing Windows (Municipal Office Lights) -->
    <g>
      <!-- Upper Floor Arched Windows -->
      <rect x="365" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <rect x="425" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <rect x="485" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <rect x="545" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />

      <!-- Lower Floor Windows -->
      <rect x="365" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <rect x="425" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <rect x="485" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <rect x="545" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- Right Wing -->
    <rect x="1000" y="320" width="260" height="220" fill="url(#buildingGrad)" rx="2" stroke="#254770" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Right Wing Roof Balustrade -->
    <rect x="990" y="305" width="280" height="15" fill="#1A3A5E" />
    <g fill="#2D5A8F" opacity="0.6">
      <rect x="1010" y="290" width="12" height="15" rx="2" />
      <rect x="1050" y="290" width="12" height="15" rx="2" />
      <rect x="1090" y="290" width="12" height="15" rx="2" />
      <rect x="1130" y="290" width="12" height="15" rx="2" />
      <rect x="1170" y="290" width="12" height="15" rx="2" />
      <rect x="1210" y="290" width="12" height="15" rx="2" />
      <rect x="1250" y="290" width="12" height="15" rx="2" />
      <rect x="990" y="285" width="280" height="5" rx="1" />
    </g>

    <!-- Right Wing Windows -->
    <g>
      <!-- Upper Floor Arched Windows -->
      <rect x="1025" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <rect x="1085" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <rect x="1145" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <rect x="1205" y="345" width="34" height="60" rx="17" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />

      <!-- Lower Floor Windows -->
      <rect x="1025" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <rect x="1085" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <rect x="1145" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <rect x="1205" y="440" width="34" height="55" rx="4" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- CENTRAL PORTICO & MONUMENTAL COLONNADE -->
    <rect x="580" y="260" width="440" height="280" fill="#10253F" stroke="#254770" stroke-width="2" />

    <!-- Neoclassical Pediment (Triangular Gable) -->
    <polygon points="560,260 800,140 1040,260" fill="#142C4B" stroke="#2D5A8F" stroke-width="3" />
    <polygon points="590,250 800,155 1010,250" fill="#0C1B2E" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />

    <!-- Civic Tympanum Medallion & Civic Balance Scale Icon -->
    <circle cx="800" cy="210" r="28" fill="#132B48" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" />
    <!-- Mini Balance Scale in Tympanum -->
    <path d="M 800 195 L 800 225 M 788 202 L 812 202 M 788 202 L 782 216 M 788 202 L 794 216 M 780 216 C 780 220 796 220 796 216 Z M 812 202 L 806 216 M 812 202 L 818 216 M 804 216 C 804 220 820 220 820 216 Z" stroke="#38BDF8" stroke-width="1.5" fill="none" />

    <!-- Central Entablature / Frieze -->
    <rect x="570" y="260" width="460" height="24" fill="#1A385C" stroke="#254770" stroke-width="1" />
    <rect x="580" y="284" width="440" height="12" fill="#122742" />

    <!-- Colonnade Pillars (6 Monumental Columns) -->
    <g>
      <!-- Column 1 -->
      <rect x="610" y="296" width="22" height="244" fill="url(#pillarGrad)" rx="3" stroke="#254770" stroke-width="1" />
      <rect x="604" y="296" width="34" height="12" fill="#254770" rx="2" />
      <rect x="604" y="530" width="34" height="12" fill="#254770" rx="2" />

      <!-- Column 2 -->
      <rect x="680" y="296" width="22" height="244" fill="url(#pillarGrad)" rx="3" stroke="#254770" stroke-width="1" />
      <rect x="674" y="296" width="34" height="12" fill="#254770" rx="2" />
      <rect x="674" y="530" width="34" height="12" fill="#254770" rx="2" />

      <!-- Column 3 -->
      <rect x="750" y="296" width="22" height="244" fill="url(#pillarGrad)" rx="3" stroke="#254770" stroke-width="1" />
      <rect x="744" y="296" width="34" height="12" fill="#254770" rx="2" />
      <rect x="744" y="530" width="34" height="12" fill="#254770" rx="2" />

      <!-- Column 4 -->
      <rect x="828" y="296" width="22" height="244" fill="url(#pillarGrad)" rx="3" stroke="#254770" stroke-width="1" />
      <rect x="822" y="296" width="34" height="12" fill="#254770" rx="2" />
      <rect x="822" y="530" width="34" height="12" fill="#254770" rx="2" />

      <!-- Column 5 -->
      <rect x="898" y="296" width="22" height="244" fill="url(#pillarGrad)" rx="3" stroke="#254770" stroke-width="1" />
      <rect x="892" y="296" width="34" height="12" fill="#254770" rx="2" />
      <rect x="892" y="530" width="34" height="12" fill="#254770" rx="2" />

      <!-- Column 6 -->
      <rect x="968" y="296" width="22" height="244" fill="url(#pillarGrad)" rx="3" stroke="#254770" stroke-width="1" />
      <rect x="962" y="296" width="34" height="12" fill="#254770" rx="2" />
      <rect x="962" y="530" width="34" height="12" fill="#254770" rx="2" />
    </g>

    <!-- Main Civic Portal & Balcony -->
    <rect x="760" y="440" width="80" height="100" rx="40" fill="#081424" stroke="#254770" stroke-width="2" />
    <rect x="770" y="470" width="60" height="70" fill="url(#windowGlow)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <!-- Mayor Balcony Railing -->
    <rect x="740" y="415" width="120" height="25" fill="#132B48" rx="2" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <g fill="#2D5A8F" opacity="0.8">
      <rect x="750" y="418" width="4" height="20" />
      <rect x="765" y="418" width="4" height="20" />
      <rect x="780" y="418" width="4" height="20" />
      <rect x="795" y="418" width="4" height="20" />
      <rect x="810" y="418" width="4" height="20" />
      <rect x="825" y="418" width="4" height="20" />
      <rect x="840" y="418" width="4" height="20" />
    </g>

    <!-- BELL & CLOCK TOWER (Torre del Reloj Consistorial) -->
    <!-- Tower Lower Base -->
    <rect x="740" y="40" width="120" height="100" fill="#132B48" stroke="#254770" stroke-width="2" />
    
    <!-- Clock Dial with Atmospheric Radial Glow -->
    <circle cx="800" cy="90" r="32" fill="#081424" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="800" cy="90" r="32" fill="url(#clockLight)" />
    <!-- Clock Hands (Indicating efficiency / time saved) -->
    <line x1="800" y1="90" x2="800" y2="72" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="800" y1="90" x2="816" y2="90" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
    <circle cx="800" cy="90" r="3" fill="#38BDF8" />
    <!-- Clock Hour Ticks -->
    <circle cx="800" cy="65" r="1.5" fill="#38BDF8" />
    <circle cx="825" cy="90" r="1.5" fill="#38BDF8" />
    <circle cx="800" cy="115" r="1.5" fill="#38BDF8" />
    <circle cx="775" cy="90" r="1.5" fill="#38BDF8" />

    <!-- Belfry / Campanario -->
    <polygon points="730,40 800,-30 870,40" fill="#142C4B" stroke="#2D5A8F" stroke-width="2" />
    <!-- Weathervane / Finial Spire -->
    <line x1="800" y1="-30" x2="800" y2="-75" stroke="#38BDF8" stroke-width="2" />
    <polygon points="800,-75 825,-65 800,-55" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- MODERN FINANCIAL DATA CURVES & FLOW LINES (Representing Automation & Savings) -->
  <g opacity="0.65">
    
    <!-- Rising Efficiency Wave (Exponential savings curve) -->
    <path d="M 0 850 C 350 820, 600 780, 900 680 C 1200 580, 1500 460, 1920 380 L 1920 1080 L 0 1080 Z" fill="url(#chartFillGrad)" />
    
    <path d="M 0 850 C 350 820, 600 780, 900 680 C 1200 580, 1500 460, 1920 380" fill="none" stroke="url(#chartWaveGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Secondary Harmonic Curve -->
    <path d="M 0 920 C 400 890, 750 820, 1100 740 C 1450 660, 1700 560, 1920 510" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="6 6" stroke-opacity="0.4" />

    <!-- Interactive Data Points / Milestones on the Curve -->
    <g>
      <!-- Point 1: 500 apuntes -->
      <circle cx="620" cy="775" r="5" fill="#0284C7" stroke="#38BDF8" stroke-width="2" />
      <circle cx="620" cy="775" r="14" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      
      <!-- Point 2: 1500 apuntes -->
      <circle cx="1080" cy="625" r="6" fill="#0284C7" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="1080" cy="625" r="18" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
      
      <!-- Point 3: -85% Mechanization Savings -->
      <circle cx="1520" cy="455" r="7" fill="#10B981" stroke="#34D399" stroke-width="2.5" />
      <circle cx="1520" cy="455" r="22" stroke="#34D399" stroke-width="1" stroke-opacity="0.5" />
    </g>

    <!-- Subtitle Bar Chart Bars in the bottom right perspective -->
    <g opacity="0.35" transform="translate(1380, 680)">
      <rect x="0" y="140" width="22" height="120" fill="#0284C7" rx="3" />
      <rect x="36" y="110" width="22" height="150" fill="#0284C7" rx="3" />
      <rect x="72" y="70" width="22" height="190" fill="#0284C7" rx="3" />
      <rect x="108" y="30" width="22" height="230" fill="#0284C7" rx="3" />
      <rect x="144" y="-20" width="22" height="280" fill="#10B981" rx="3" />
      <line x1="-15" y1="260" x2="190" y2="260" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
    </g>
  </g>

  <!-- Digital Coordinate Markers and Subtle Code/Ledger Annotations -->
  <g opacity="0.4" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">
    <text x="80" y="960">NORMA 43 · CONCILIACIÓN AUTOMATIZADA</text>
    <text x="80" y="980" fill="#94A3B8" font-size="9" font-weight="normal">ASIENTOS DIRECTOS A DIARIO GENERAL · SECTOR PÚBLICO</text>
    <text x="1620" y="960" text-anchor="end">AHORRO AUDITADO &gt; 85%</text>
    <text x="1620" y="980" text-anchor="end" fill="#34D399" font-size="10">TIEMPO RECUPERADO PARA GESTIÓN LOCAL</text>
  </g>

  <!-- Radial Vignette Overlay to guarantee 100% foreground contrast & readability -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="20%" stop-color="#070E1A" stop-opacity="0.65" />
    <stop offset="65%" stop-color="#070E1A" stop-opacity="0.85" />
    <stop offset="100%" stop-color="#040810" stop-opacity="0.97" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)" />
</svg>
