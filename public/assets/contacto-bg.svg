<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <!-- Background Gradient: Clean Institutional Palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6E7F6" />
      <stop offset="35%" stop-color="#CBE0F2" />
      <stop offset="70%" stop-color="#C2DCF0" />
      <stop offset="100%" stop-color="#CCE2F4" />
    </linearGradient>

    <!-- Warm Institutional Atmosphere Glows -->
    <radialGradient id="telecomGlow" cx="22%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#025B80" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D6E7F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="deskLampGlow" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Wave & Flow Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#025B80" stop-opacity="0.06" />
      <stop offset="25%" stop-color="#0284C7" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#0EA5E9" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.10" />
    </linearGradient>

    <!-- Subtle Dot Grid for Technical Architecture -->
    <pattern id="contactGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0284C7" stroke-width="0.85" stroke-opacity="0.10" />
      <circle cx="0" cy="0" r="1.5" fill="#025B80" fill-opacity="0.16" />
    </pattern>
  </defs>

  <!-- Base Canvas & Ambient Glows -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#contactGrid)" />
  <rect width="1920" height="1080" fill="url(#telecomGlow)" />
  <rect width="1920" height="1080" fill="url(#deskLampGlow)" />

  <!-- Communication Waveforms & Acoustic Signal Rays -->
  <g opacity="0.9">
    <path d="M-100 420 C 280 260, 580 590, 1080 360 C 1480 180, 1780 460, 2050 340" fill="none" stroke="url(#waveGrad1)" stroke-width="3" />
    <path d="M-100 490 C 330 320, 660 670, 1130 420 C 1530 240, 1800 520, 2050 400" fill="none" stroke="url(#waveGrad1)" stroke-width="2" stroke-dasharray="10 6" />
    <path d="M-50 580 C 380 390, 730 750, 1200 480 C 1580 300, 1830 600, 2050 470" fill="none" stroke="url(#waveGrad2)" stroke-width="1.75" />
    
    <!-- Concentric Waves: Direct Phone Line 976 480 084 Origin -->
    <g transform="translate(220, 310)">
      <circle cx="0" cy="0" r="80" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="150" fill="none" stroke="#0284C7" stroke-width="1.3" stroke-opacity="0.09" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="230" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.06" />
      <circle cx="0" cy="0" r="330" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.04" stroke-dasharray="8 6" />
      <circle cx="0" cy="0" r="450" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.03" />
    </g>
  </g>

  <!-- Prominent Customer Contact / Advisory Silhouette (Desk Phone, Operator Headset, Envelopes) -->
  <g transform="translate(130, 150)" opacity="0.16">
    <!-- Modern Telephone Terminal Base -->
    <rect x="20" y="160" width="130" height="95" rx="12" fill="#025B80" />
    <!-- Telephone Screen & Dial Buttons -->
    <rect x="35" y="175" width="55" height="32" rx="4" fill="#FFFFFF" fill-opacity="0.7" />
    <circle cx="110" cy="182" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="125" cy="182" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="110" cy="198" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="125" cy="198" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="110" cy="214" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="125" cy="214" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="110" cy="230" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="125" cy="230" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <!-- Handset receiver -->
    <path d="M-10 145 C-10 120, 20 120, 45 140 L 45 270 C 20 290, -10 290, -10 265 Z" fill="#025B80" />
    <!-- Curly cord -->
    <path d="M15 275 Q 10 300 25 310 T 35 330 T 50 315 T 70 325 T 90 300 L 90 255" fill="none" stroke="#025B80" stroke-width="4" stroke-linecap="round" />

    <!-- Headset for Direct Consultation -->
    <g transform="translate(210, 40)">
      <path d="M50 40 A 65 65 0 0 1 180 40" fill="none" stroke="#025B80" stroke-width="8" stroke-linecap="round" />
      <rect x="32" y="32" width="22" height="42" rx="11" fill="#025B80" />
      <rect x="176" y="32" width="22" height="42" rx="11" fill="#025B80" />
      <path d="M42 70 C 42 110, 75 130, 115 130" fill="none" stroke="#025B80" stroke-width="5" stroke-linecap="round" />
      <circle cx="122" cy="130" r="8" fill="#025B80" />
    </g>
  </g>

  <!-- Digital Mail / Envelope Silhouettes for info@ccbosco.com -->
  <g transform="translate(860, 120)" opacity="0.18">
    <rect x="0" y="0" width="110" height="74" rx="10" fill="#FFFFFF" stroke="#025B80" stroke-width="3" />
    <path d="M0 0 L 55 42 L 110 0" fill="none" stroke="#025B80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M0 74 L 40 34" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    <path d="M110 74 L 70 34" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Location Pin Motifs: Zaragoza Headquarters (Reina Fabiola, 37) -->
  <g transform="translate(1620, 160)" opacity="0.16">
    <path d="M45 0 C20 0 0 20 0 45 C0 78 45 125 45 125 C45 125 90 78 90 45 C90 20 70 0 45 0 Z" fill="#025B80" />
    <circle cx="45" cy="42" r="16" fill="#FFFFFF" />
    <!-- City Skyline / Municipal Building Backdrop hint -->
    <path d="M-80 125 L 180 125" stroke="#0284C7" stroke-width="3" />
    <rect x="-60" y="65" width="30" height="60" fill="none" stroke="#0284C7" stroke-width="2" />
    <rect x="-20" y="45" width="35" height="80" fill="none" stroke="#0284C7" stroke-width="2" />
    <rect x="95" y="55" width="25" height="70" fill="none" stroke="#0284C7" stroke-width="2" />
    <rect x="130" y="75" width="35" height="50" fill="none" stroke="#0284C7" stroke-width="2" />
  </g>

  <!-- Interconnected Consultation Mesh (Direct Dialogue: Entidad Local <-> Intervención <-> Centro Cálculo Bosco) -->
  <g opacity="0.30">
    <!-- Hub 1: Entidad Local -->
    <circle cx="260" cy="740" r="6" fill="#025B80" />
    <circle cx="260" cy="740" r="18" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="260" y="776" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle" letter-spacing="1">ENTIDAD LOCAL</text>

    <!-- Connection -->
    <line x1="260" y1="740" x2="540" y2="640" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="540" cy="640" r="5" fill="#0EA5E9" />

    <!-- Hub 2: Centro Cálculo Bosco -->
    <line x1="540" y1="640" x2="880" y2="760" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="880" cy="760" r="8" fill="#025B80" />
    <circle cx="880" cy="760" r="24" fill="none" stroke="#025B80" stroke-width="1.5" />
    <text x="880" y="802" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#025B80" text-anchor="middle" letter-spacing="1">CENTRO CÁLCULO BOSCO</text>

    <!-- Hub 3: Intervención & Tesorería -->
    <line x1="880" y1="760" x2="1240" y2="660" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="1240" cy="660" r="5" fill="#0EA5E9" />

    <line x1="1240" y1="660" x2="1560" y2="770" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="1560" cy="770" r="7" fill="#025B80" />
    <text x="1560" y="808" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle" letter-spacing="1">INTERVENCIÓN MUNICIPAL</text>
  </g>

  <!-- Speech and Communication Bubbles -->
  <g opacity="0.22" transform="translate(1380, 80)">
    <rect x="0" y="0" width="180" height="66" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <path d="M 25 66 L 35 84 L 48 66 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <rect x="22" y="20" width="90" height="6" rx="3" fill="#025B80" fill-opacity="0.4" />
    <rect x="22" y="36" width="135" height="6" rx="3" fill="#0284C7" fill-opacity="0.25" />
  </g>

  <!-- Office Perspective Lines in Background -->
  <g opacity="0.14">
    <line x1="1050" y1="200" x2="1920" y2="200" stroke="#0284C7" stroke-width="1" />
    <line x1="1150" y1="360" x2="1920" y2="360" stroke="#0284C7" stroke-width="1" />
    <line x1="1020" y1="520" x2="1920" y2="520" stroke="#0284C7" stroke-width="1" />
    <line x1="1200" y1="200" x2="1080" y2="900" stroke="#0284C7" stroke-width="1" />
    <line x1="1400" y1="200" x2="1280" y2="900" stroke="#0284C7" stroke-width="1" />
    <line x1="1650" y1="200" x2="1530" y2="900" stroke="#0284C7" stroke-width="1" />
  </g>
</svg>
